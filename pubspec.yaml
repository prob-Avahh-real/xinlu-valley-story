name: xinlu_grain_valley
description: 芯麓谷物语 — 移动端像素风农场模拟 RPG
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Game Engine ──
  flame: ^1.18.0
  bonfire: ^3.6.2
  # ── State Management ──
  provider: ^6.1.5+1

  # ── Persistence ──
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # ── Audio ──
  flame_audio: ^2.10.0

  # ── Utilities ──
  uuid: ^4.5.3
  intl: ^0.20.2

  # ── UI Helpers ──
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

dependency_overrides:
  flame: 1.18.0
  ordered_set: 5.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/tiles/
    - assets/images/characters/
    - assets/images/items/
    - assets/images/ui/
    - assets/images/effects/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/maps/

  fonts:
    - family: PixelFont
      fonts:
        - asset: assets/fonts/pixel.ttf
